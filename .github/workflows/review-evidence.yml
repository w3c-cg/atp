name: Review evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  existing-review-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check runtime fallback and failure reporting
        run: python3 -I scripts/test-review-runtime.py
      - name: Run contributor review checks
        run: python3 -I scripts/check-review-evidence.py > review-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contributor-review-results
          path: review-results.json
